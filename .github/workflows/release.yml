name: Release

# Runs after every merge to main: packages the current repo/ content (the
# model repository as served at models.geo.sh.ch) as a timestamped ZIP and
# publishes it as a GitHub release.
on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    name: Create release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Zips the *contents* of repo/ (not the folder itself), so the archive
      # root matches the layout served at models.geo.sh.ch (ilidata.xml,
      # AGI/, FA/, ... directly at the top level).
      - name: Build release archive
        id: archive
        run: |
          name="models.geo.sh.ch_$(date -u +%Y%m%d%H%M)"
          (cd repo && zip -rq "../${name}.ZIP" .)
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.archive.outputs.name }}" \
            "${{ steps.archive.outputs.name }}.ZIP" \
            --title "${{ steps.archive.outputs.name }}" \
            --notes "Automated release of the models.geo.sh.ch model repository, built from commit ${{ github.sha }}."
