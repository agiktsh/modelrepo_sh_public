name: Validate and index new data files

# Runs when a pull request adds or changes an *.xml data/catalogue file under
# repository/. Every such file is first validated against its model with
# ilivalidator; only if that succeeds is repository/ilidata.xml updated:
# added files get a fresh entry, modified files get a new dataset-version
# entry appended to their existing one (ilivalidator --updateIliData).
#
# The commit is pushed WITHOUT "[skip ci]": that would also stop this
# workflow (and validate-models.yml) from ever reporting a status for that
# commit, so a PR's required checks would hang forever on "waiting for status
# to be reported". Re-triggering is safe: with nothing new/changed left,
# "Determine changed data files" finds nothing and the job ends immediately.
on:
  pull_request:
    branches:
      - main
    paths:
      - "repository/*.xml"
      - "repository/**/*.xml"

permissions:
  contents: write

env:
  ILIVALIDATOR_VERSION: "1.15.0"

jobs:
  validate-and-index:
    runs-on: ubuntu-latest
    name: ilivalidator + update ilidata.xml

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Determine changed data files
        id: changed-files
        run: |
          added=$(git diff --name-only --diff-filter=A \
            "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" \
            -- 'repository/*.xml' 'repository/**/*.xml' \
            | grep -vE '/(ilidata|ilimodels|ilisite)\.xml$' | sed 's#^repository/##')
          modified=$(git diff --name-only --diff-filter=M \
            "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" \
            -- 'repository/*.xml' 'repository/**/*.xml' \
            | grep -vE '/(ilidata|ilimodels|ilisite)\.xml$' | sed 's#^repository/##')

          echo "Added data files:"
          echo "$added"
          echo "Modified data files:"
          echo "$modified"

          {
            echo "added<<EOF"
            echo "$added"
            echo "EOF"
            echo "modified<<EOF"
            echo "$modified"
            echo "EOF"
            echo "all<<EOF"
            printf '%s\n%s\n' "$added" "$modified"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up JDK
        if: steps.changed-files.outputs.all != ''
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache ilivalidator distribution
        if: steps.changed-files.outputs.all != ''
        uses: actions/cache@v4
        with:
          path: ~/ilitools/ilivalidator-${{ env.ILIVALIDATOR_VERSION }}
          key: ilivalidator-${{ env.ILIVALIDATOR_VERSION }}

      - name: Download ilivalidator
        if: steps.changed-files.outputs.all != ''
        run: |
          installDir=~/ilitools/ilivalidator-${ILIVALIDATOR_VERSION}
          if [ ! -f "$installDir/ilivalidator-${ILIVALIDATOR_VERSION}.jar" ]; then
            mkdir -p "$installDir"
            curl -sSL -o /tmp/ilivalidator.zip "https://downloads.interlis.ch/ilivalidator/ilivalidator-${ILIVALIDATOR_VERSION}.zip"
            unzip -q -o /tmp/ilivalidator.zip -d "$installDir"
          fi
          echo "ILIVALIDATOR_JAR=$installDir/ilivalidator-${ILIVALIDATOR_VERSION}.jar" >> "$GITHUB_ENV"

      - name: Cache resolved external models
        if: steps.changed-files.outputs.all != ''
        uses: actions/cache@v4
        with:
          path: ~/.ilicache
          key: ilicache-${{ hashFiles('repository/**/*.ili') }}
          restore-keys: |
            ilicache-

      - name: Validate changed data files
        if: steps.changed-files.outputs.all != ''
        run: .github/scripts/validate-new-data-files.sh ${{ steps.changed-files.outputs.all }}

      - name: Add ilidata.xml entries for new files
        if: steps.changed-files.outputs.added != ''
        run: .github/scripts/add-ilidata-entries.sh ${{ steps.changed-files.outputs.added }}

      - name: Update ilidata.xml entries for modified files
        if: steps.changed-files.outputs.modified != ''
        run: .github/scripts/update-ilidata-entries.sh ${{ steps.changed-files.outputs.modified }}

      - name: Commit updated ilidata.xml
        if: steps.changed-files.outputs.all != ''
        run: |
          if git diff --quiet -- repository/ilidata.xml; then
            echo "ilidata.xml already up to date, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repository/ilidata.xml
          git commit -m "Update ilidata.xml entries"
          git push origin HEAD:"${{ github.event.pull_request.head.ref }}"
